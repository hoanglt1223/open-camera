# SPDX-License-Identifier: Apache-2.0
#
# F-Droid recipe as proposed to fdroiddata (metadata/dev.opencamera.app.yml there).
# Builds the foss flavor: no prebuilt ML runtimes, OpenCV built from source. F-Droid signs it;
# the signed full build is served by https://hoanglt1223.github.io/open-camera-fdroid/repo.
Categories:
  - Camera
License: Apache-2.0
AuthorName: Open Camera contributors
SourceCode: https://github.com/hoanglt1223/open-camera
IssueTracker: https://github.com/hoanglt1223/open-camera/issues
Changelog: https://github.com/hoanglt1223/open-camera/releases

AutoName: Open Camera

RepoType: git
Repo: https://github.com/hoanglt1223/open-camera.git

Builds:
  - versionName: 0.1.0-beta4
    versionCode: 4
    commit: 50643bf0363da4984ad0a7f0f0c06646002e3265
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y cmake ninja-build
    gradle:
      - foss
    srclibs:
      - open-camera-profiles@f8dceb0a509a0a287e4c9c0a9083984d72d0f5d2
      - opencv@ea8e60798e0319ccbe902f7994153b574f639809
    rm:
      - app/libs
      - gradle/soong.gradle
    prebuild: echo "openCamera.profiles.dir=$$open-camera-profiles$$" >> ../local.properties
    scanignore:
      - settings.gradle.kts
    build: CMAKE_DIR=/usr/bin bash ../scripts/fdroid/build-opencv-android.sh $$opencv$$
      ../opencv-out arm64-v8a armeabi-v7a
    ndk: 27.0.12077973
    gradleprops:
      - openCamera.opencvDir=opencv-out

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+(-beta[0-9]+)?$
CurrentVersion: 0.1.0-beta4
CurrentVersionCode: 4
