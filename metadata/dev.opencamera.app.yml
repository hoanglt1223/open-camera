AutoName: Open Camera
Summary: Camera with multi-frame HDR, night mode, looks and manual controls
Description: |-
  Open Camera is a camera app built on CameraX and Camera2.

  * Multi-frame HDR, Night and Astro processed on the device
  * Looks, frames and a photo editor
  * Pro mode with manual ISO, shutter, focus and white balance, RAW capture
  * Video modes and QR scanning
  * No network access by default; crash reports stay on the device unless you share them

  Part of the native code (RAW decoding) uses LibRaw under LGPL-2.1 as a separate shared library.

