name: build

runs:
    using: composite

    steps:
    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 17
        cache: 'gradle'

    - name: Build, test and lint
      shell: bash
      run: ./gradlew assembleDebug test lint

    - name: Check no vendor libraries are bundled
      shell: bash
      run: bash scripts/check-no-vendor-libs.sh app/build/outputs/apk/debug/app-debug.apk

    - name: Check Android.bp is up to date
      shell: bash
      run: |
        ./gradlew app:generateBp
        if [[ ! -z $(git status -s) ]]; then
          git status
          git diff
          exit 1
        fi

    - uses: actions/upload-artifact@v7
      with:
        name: app-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
        archive: false